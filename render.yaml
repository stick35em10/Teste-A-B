# Render Configuration File
# Deploy: Teste A/B - Análise Estatística
# Platform: Web Service

version: '1'

services:
  # 🎯 Serviço Web Principal (Dashboard)
  - type: web
    name: teste-ab-dashboard
    env: python
    plan: free
    region: ohio
    branch: dev_to_deploy
    
    # Configurações do Build
    buildCommand: pip install -r requirements.txt
      
    # Comando de Inicialização (Simplificado)
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120 #python app.py
    
    # Variáveis de Ambiente
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0  # Updated to newer version
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHONUNBUFFERED
        value: true
    
    # Health Check (Removido se não existir a rota)
    # healthCheckPath: /health
    autoDeploy: true

  # 📈 Serviço de Redis (Cache) - Opcional
  - type: redis
    name: teste-ab-cache
    plan: free
    region: ohio
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
  
    # Otimizações para free tier
    # healthCheckPath: /health
    # healthCheckTimeout: 30
    # autoDeploy: true
